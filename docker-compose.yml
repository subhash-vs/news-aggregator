services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-aggregator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GUARDIAN_API_KEY=${GUARDIAN_API_KEY}
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - news-data:/app/data
    networks:
      - news-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: news-aggregator-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - news-network
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  news-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  news-network:
    driver: bridge
