name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build --webpack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next
            node_modules
            package.json
            public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Rsync to VM
        run: |
          rsync -avz --delete \
            --exclude 'data/' \
            --exclude '.env.local' \
            --exclude '.git/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "opc@${{ secrets.ORACLE_HOST }}:~/news-aggregator/"

      - name: Fix sqlite binary and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "opc@${{ secrets.ORACLE_HOST }}" "
            export PATH=/usr/local/bin:\$PATH
            if ! command -v node &> /dev/null; then
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
              sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            fi
            cd ~/news-aggregator
            npm rebuild better-sqlite3 2>&1 | tail -3
            mkdir -p data
            echo 'GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}' > .env.production

            sudo tee /etc/systemd/system/news-aggregator.service > /dev/null << 'SERVICE'
[Unit]
Description=News Aggregator
After=network.target

[Service]
Type=simple
User=opc
WorkingDirectory=/home/opc/news-aggregator
ExecStart=/usr/local/bin/node node_modules/next/dist/bin/next start -p 3000
Environment=NODE_ENV=production
Environment=PORT=3000
Environment=HOSTNAME=0.0.0.0
Restart=on-failure
RestartSec=10

[Install]
WantedBy=multi-user.target
SERVICE

            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable news-aggregator
            sudo systemctl restart news-aggregator
            sleep 8
            sudo systemctl is-active news-aggregator
          "
