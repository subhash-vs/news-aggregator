name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: oraclelinux:9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js and build tools
        run: |
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          dnf install -y gcc-c++ make python3
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build --webpack

      - name: Package
        run: |
          tar -czf deploy.tar.gz \
            .next \
            node_modules \
            package.json \
            public \
            .env.production 2>/dev/null || tar -czf deploy.tar.gz \
            .next \
            node_modules \
            package.json \
            public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ol9
          path: deploy.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-ol9

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy.tar.gz "opc@${{ secrets.ORACLE_HOST }}:/tmp/deploy.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "opc@${{ secrets.ORACLE_HOST }}" "
            export PATH=/usr/local/bin:\$PATH
            if ! command -v node &> /dev/null; then
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
              sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            fi
            rm -rf ~/news-aggregator
            mkdir -p ~/news-aggregator
            tar -xzf /tmp/deploy.tar.gz -C ~/news-aggregator
            cd ~/news-aggregator
            mkdir -p data
            echo 'GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}' > .env.production

            sudo tee /etc/systemd/system/news-aggregator.service > /dev/null << 'SERVICE'
[Unit]
Description=News Aggregator
After=network.target

[Service]
Type=simple
User=opc
WorkingDirectory=/home/opc/news-aggregator
ExecStart=/usr/local/bin/node node_modules/next/dist/bin/next start -p 3000
Environment=NODE_ENV=production
Environment=PORT=3000
Environment=HOSTNAME=0.0.0.0
Restart=on-failure
RestartSec=10

[Install]
WantedBy=multi-user.target
SERVICE

            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable news-aggregator
            sudo systemctl restart news-aggregator
            sleep 8
            sudo systemctl is-active news-aggregator
          "
