name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build --webpack

      - name: Recompile sqlite for Oracle Linux 9
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:22-bullseye bash -c '
            apt-get update -qq && apt-get install -y -qq python3 make g++ > /dev/null 2>&1
            cd /app/node_modules/better-sqlite3
            rm -rf prebuilds build
            sed -i "s/NAPI_VERSION=10/NAPI_VERSION=9/g" binding.gyp
            sed -i "s/'"'"'-flto'"'"',//g" binding.gyp
            npx node-gyp rebuild --release
            mkdir -p prebuilds
            cp build/Release/better_sqlite3.node prebuilds/linux-x64.node
            echo "Binary compiled with NAPI_VERSION=9"
          ' && ls -la node_modules/better-sqlite3/prebuilds/linux-x64.node

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Rsync to VM
        run: |
          rsync -avz --delete \
            --exclude 'data/' \
            --exclude '.env.local' \
            --exclude '.env.local.*' \
            --exclude '.git/' \
            --exclude 'deploy/' \
            --exclude 'docs/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "opc@${{ secrets.ORACLE_HOST }}:~/news-aggregator/"

      - name: Start service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "opc@${{ secrets.ORACLE_HOST }}" '
            export PATH=/usr/local/bin:$PATH
            if ! command -v node > /dev/null 2>&1; then
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
              sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            fi
            printf "[Unit]\nDescription=News Aggregator\nAfter=network.target\n\n[Service]\nType=simple\nUser=opc\nWorkingDirectory=/home/opc/news-aggregator\nExecStart=/usr/local/bin/node node_modules/next/dist/bin/next start -p 3000\nEnvironment=NODE_ENV=production\nEnvironment=PORT=3000\nEnvironment=HOSTNAME=0.0.0.0\nRestart=on-failure\nRestartSec=10\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/news-aggregator.service > /dev/null
            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable news-aggregator
            sudo systemctl restart news-aggregator
            sleep 8
            sudo systemctl is-active news-aggregator
          '
