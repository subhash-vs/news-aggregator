name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: oraclelinux:9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 22
        run: |
          dnf install -y xz
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version

      - name: Install build tools
        run: dnf install -y gcc-c++ make python3 && dnf clean all

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build --webpack

      - name: Package
        run: |
          echo "GUARDIAN_API_KEY=placeholder" > .env.production
          tar -czf deploy.tar.gz .next node_modules package.json public .env.production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ol9
          path: deploy.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-ol9

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy.tar.gz "opc@${{ secrets.ORACLE_HOST }}:/tmp/deploy.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "opc@${{ secrets.ORACLE_HOST }}" '
            export PATH=/usr/local/bin:$PATH
            if ! command -v node > /dev/null 2>&1; then
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
              sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            fi
            rm -rf ~/news-aggregator
            mkdir -p ~/news-aggregator/data
            tar -xzf /tmp/deploy.tar.gz -C ~/news-aggregator
            sed -i "s/placeholder/'"$GUARDIAN_API_KEY"'/" ~/news-aggregator/.env.production 2>/dev/null || true
            printf "[Unit]\nDescription=News Aggregator\nAfter=network.target\n\n[Service]\nType=simple\nUser=opc\nWorkingDirectory=/home/opc/news-aggregator\nExecStart=/usr/local/bin/node node_modules/next/dist/bin/next start -p 3000\nEnvironment=NODE_ENV=production\nEnvironment=PORT=3000\nEnvironment=HOSTNAME=0.0.0.0\nRestart=on-failure\nRestartSec=10\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/news-aggregator.service > /dev/null
            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable news-aggregator
            sudo systemctl restart news-aggregator
            sleep 8
            sudo systemctl is-active news-aggregator
          '
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
